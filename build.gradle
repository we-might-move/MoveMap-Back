plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

springBoot {
    mainClass = 'org.wemightmove.movemap.MovemapApplication'
}

group = 'org.wemightmove'
version = '0.0.1-SNAPSHOT'
description = 'movemap'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Swagger
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Caffeine (검색 결과 로컬 2-tier 캐시, Stage 2 — 설계 §5.3). 버전은 Boot BOM이 관리.
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // PostgreSQL + PostGIS
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.hibernate:hibernate-spatial:6.3.1.Final'
    implementation 'org.hibernate.orm:hibernate-spatial'

    // Elasticsearch
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // Micrometer core (검색 색인/리컨실 메트릭용). actuator 미도입 — 경량 core만 추가.
    // 버전은 Spring Boot BOM이 관리. 실제 레지스트리(prometheus 등)는 T7/프로덕션에서 주입 가능.
    implementation 'io.micrometer:micrometer-core'

    // test
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:elasticsearch:1.20.1'
    testImplementation 'com.redis.testcontainers:testcontainers-redis:1.6.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JSON 파싱용 (jackson 기반)

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Flyway
    implementation "org.flywaydb:flyway-database-postgresql"

    // Expo Push Notifications
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

//     Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.2.0'

    // Notification Retry
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // QueryDSL 관련
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    //thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
}

// QueryDSL Q 클래스 생성 경로
def querydslDir = "build/generated/querydsl"

sourceSets {
    main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

clean {
    delete file(querydslDir)
}

tasks.named('test') {
    useJUnitPlatform()
}
