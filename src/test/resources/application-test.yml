# src/test/resources/application-test.yml
spring:
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
  datasource:
    hikari:
      maximum-pool-size: 4
    url: jdbc:postgresql://localhost:5432/movemap
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  devtools:
    restart:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  http:
    client:
      connect-timeout: 5000
      read-timeout: 5000

  mail:
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  data:
    redis:
      host: localhost
      port: 6379
      password: redis

firebase:
  enabled: false

push:
  retry:
    max-attempts: 5
    schedule-rate: 300000
    batch-size: 50

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.testcontainers: INFO